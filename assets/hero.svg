<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="3s" repeatCount="indefinite" />
    </pattern>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="400" fill="#030712" />
  <rect width="1200" height="400" fill="url(#grid)" />
  
  <!-- Scanning Laser Line -->
  <rect x="0" y="0" width="1200" height="4" fill="#06b6d4" opacity="0.6" filter="url(#glow)">
    <animate attributeName="y" values="-10;410;-10" dur="4s" repeatCount="indefinite" />
  </rect>

  <text x="600" y="180" font-family="monospace" font-size="90" font-weight="900" fill="url(#neon)" text-anchor="middle" filter="url(#glow)" letter-spacing="15">
    AYUSH
    <animate attributeName="opacity" values="1;0.8;1;0.4;1" dur="3s" repeatCount="indefinite" />
  </text>
  
  <text x="600" y="240" font-family="monospace" font-size="24" fill="#9ca3af" text-anchor="middle" letter-spacing="6">
    18 Y/O • 12TH PASS • FULL-STACK ARCHITECT
  </text>

  <rect x="450" y="280" width="300" height="40" rx="20" fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="306" font-family="monospace" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">
    &gt; INITIATING SYSTEM_
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </text>
</svg>
