<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="#030712" />
  
  <text x="600" y="50" font-family="monospace" font-size="24" fill="#f472b6" text-anchor="middle" letter-spacing="4">[ DEPLOYED SYSTEMS ]</text>
  <path d="M 400 65 L 800 65" stroke="#f472b6" stroke-width="2" stroke-dasharray="10 5">
    <animate attributeName="stroke-dashoffset" values="15;0" dur="1s" repeatCount="indefinite" />
  </path>

  <!-- Card 1: Prepare-X -->
  <g transform="translate(50, 100)">
    <rect width="250" height="240" rx="15" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="220" cy="30" r="8" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="40" font-family="monospace" font-size="18" fill="#c084fc" font-weight="bold">PREPARE-X</text>
    <text x="20" y="80" font-family="sans-serif" font-size="14" fill="#9ca3af">CUET Exam Simulator</text>
    <text x="20" y="105" font-family="sans-serif" font-size="14" fill="#9ca3af">1200+ PYQs, WebAudio</text>
    <text x="20" y="130" font-family="sans-serif" font-size="14" fill="#9ca3af">Engine, Zustand, Next15</text>
    <rect x="20" y="180" width="210" height="30" rx="5" fill="#8b5cf6" opacity="0.2"/>
    <text x="125" y="200" font-family="monospace" font-size="14" fill="#e9d5ff" text-anchor="middle">STATUS: LIVE</text>
  </g>

  <!-- Card 2: Nexus -->
  <g transform="translate(330, 100)">
    <rect width="250" height="240" rx="15" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="220" cy="30" r="8" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text x="20" y="40" font-family="monospace" font-size="18" fill="#22d3ee" font-weight="bold">NEXUS</text>
    <text x="20" y="80" font-family="sans-serif" font-size="14" fill="#9ca3af">Real-time Chat App</text>
    <text x="20" y="105" font-family="sans-serif" font-size="14" fill="#9ca3af">Supabase Realtime,</text>
    <text x="20" y="130" font-family="sans-serif" font-size="14" fill="#9ca3af">Capacitor, Offline-first</text>
    <rect x="20" y="180" width="210" height="30" rx="5" fill="#06b6d4" opacity="0.2"/>
    <text x="125" y="200" font-family="monospace" font-size="14" fill="#cffafe" text-anchor="middle">STATUS: LIVE</text>
  </g>

  <!-- Card 3: Aurix -->
  <g transform="translate(610, 100)">
    <rect width="250" height="240" rx="15" fill="url(#cardGrad)" stroke="#1db954" stroke-width="2"/>
    <circle cx="220" cy="30" r="8" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text x="20" y="40" font-family="monospace" font-size="18" fill="#4ade80" font-weight="bold">AURIX</text>
    <text x="20" y="80" font-family="sans-serif" font-size="14" fill="#9ca3af">Music Dist. Pipeline</text>
    <text x="20" y="105" font-family="sans-serif" font-size="14" fill="#9ca3af">YT iframe, iTunes Meta,</text>
    <text x="20" y="130" font-family="sans-serif" font-size="14" fill="#9ca3af">Auto-upload to Spotify</text>
    <rect x="20" y="180" width="210" height="30" rx="5" fill="#1db954" opacity="0.2"/>
    <text x="125" y="200" font-family="monospace" font-size="14" fill="#dcfce7" text-anchor="middle">STATUS: LIVE</text>
  </g>

  <!-- Card 4: Maths Patterns -->
  <g transform="translate(890, 100)">
    <rect width="250" height="240" rx="15" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="220" cy="30" r="8" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <text x="20" y="40" font-family="monospace" font-size="18" fill="#fbbf24" font-weight="bold">MATHS PATTERNS</text>
    <text x="20" y="80" font-family="sans-serif" font-size="14" fill="#9ca3af">Factual Visualizer</text>
    <text x="20" y="105" font-family="sans-serif" font-size="14" fill="#9ca3af">Algorithmic rendering,</text>
    <text x="20" y="130" font-family="sans-serif" font-size="14" fill="#9ca3af">Three.js, WebGL Shaders</text>
    <rect x="20" y="180" width="210" height="30" rx="5" fill="#f59e0b" opacity="0.2"/>
    <text x="125" y="200" font-family="monospace" font-size="14" fill="#fef3c7" text-anchor="middle">STATUS: LIVE</text>
  </g>
</svg>
