<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="44 44" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="180" cy="80" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="260" r="160" fill="#06b6d4" opacity="0.14" filter="url(#glow)">
    <animate attributeName="cx" values="1020;940;1020" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="0" width="1200" height="3" fill="#22d3ee" opacity="0.5" filter="url(#glow)">
    <animate attributeName="y" values="-10;350;-10" dur="5s" repeatCount="indefinite"/>
  </rect>
  <path d="M40 60 V40 H60" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.7"/>
  <path d="M1160 60 V40 H1140" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.7"/>
  <path d="M40 280 V300 H60" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.7"/>
  <path d="M1160 280 V300 H1140" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.7"/>
  <text x="600" y="150" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="86" font-weight="800" fill="url(#name)" letter-spacing="6" filter="url(#glow)">AYUSH</text>
  <text x="600" y="200" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="26" font-weight="600" fill="#e2e8f0" letter-spacing="1">18 • Independent Developer • Systems Architect</text>
  <text x="600" y="245" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#64748b" letter-spacing="2">NEXT.JS // REACT // SUPABASE // CAPACITOR // THREE.JS</text>
  <circle cx="520" cy="285" r="5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="535" y="290" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#94a3b8">shipping to production</text>
</svg>
