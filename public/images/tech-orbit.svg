<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="orbitBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#orbitBg)" rx="24"/>
  
  <circle cx="400" cy="200" r="45" fill="#6366f1" opacity="0.2">
    <animate attributeName="r" values="45;55;45" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="200" r="35" fill="#4f46e5"/>
  <text x="400" y="195" font-family="system-ui" font-size="14" font-weight="bold" fill="white" text-anchor="middle">AYUSH</text>
  <text x="400" y="215" font-family="system-ui" font-size="10" font-weight="normal" fill="#cbd5e1" text-anchor="middle">CORE</text>

  <circle cx="400" cy="200" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="4 4"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 200" to="360 400 200" dur="20s" repeatCount="indefinite"/>
    <circle cx="510" cy="200" r="22" fill="#61DAFB"/>
    <text x="510" y="204" font-family="system-ui" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">React</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 400 200" to="480 400 200" dur="20s" repeatCount="indefinite"/>
    <circle cx="510" cy="200" r="22" fill="#000000" stroke="#fff" stroke-width="2"/>
    <text x="510" y="204" font-family="system-ui" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Next</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 400 200" to="600 400 200" dur="20s" repeatCount="indefinite"/>
    <circle cx="510" cy="200" r="22" fill="#3178C6"/>
    <text x="510" y="204" font-family="system-ui" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">TS</text>
  </g>

  <circle cx="400" cy="200" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="2 6"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="45 400 200" to="-315 400 200" dur="30s" repeatCount="indefinite"/>
    <circle cx="570" cy="200" r="20" fill="#3ECF8E"/>
    <text x="570" y="204" font-family="system-ui" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Supa</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="135 400 200" to="-225 400 200" dur="30s" repeatCount="indefinite"/>
    <circle cx="570" cy="200" r="20" fill="#06B6D4"/>
    <text x="570" y="204" font-family="system-ui" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">TW</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="225 400 200" to="-135 400 200" dur="30s" repeatCount="indefinite"/>
    <circle cx="570" cy="200" r="20" fill="#119EFF"/>
    <text x="570" y="204" font-family="system-ui" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">Cap</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="315 400 200" to="-45 400 200" dur="30s" repeatCount="indefinite"/>
    <circle cx="570" cy="200" r="20" fill="#FFCA28"/>
    <text x="570" y="204" font-family="system-ui" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">FB</text>
  </g>
</svg>
