<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#22d3ee;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#22d3ee;#818cf8;#c084fc" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#c084fc;#22d3ee" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1000" height="300" fill="url(#bgGrad)" rx="24" />
  <rect width="1000" height="300" fill="url(#grid)" rx="24" />
  
  <circle cx="200" cy="150" r="120" fill="#818cf8" opacity="0.15" filter="blur(40px)">
    <animate attributeName="cx" values="200;250;200" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="800" cy="150" r="140" fill="#22d3ee" opacity="0.15" filter="blur(50px)">
    <animate attributeName="cx" values="800;750;800" dur="10s" repeatCount="indefinite" />
  </circle>

  <text x="500" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">
    AYUSH
  </text>
  <text x="500" y="180" font-family="ui-monospace, monospace" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">
    18 • INDIE DEVELOPER • BUILDER
  </text>
  <text x="500" y="220" font-family="ui-monospace, monospace" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Full-Stack Web • Mobile Apps • Music Tech • 3D UI
  </text>
</svg>
